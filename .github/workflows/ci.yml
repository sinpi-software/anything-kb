name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  neonews:
    name: test + lint + type (neonews)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neonews
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ingestion
          POSTGRES_PASSWORD: ingestion
          POSTGRES_DB: ingestion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ingestion -d ingestion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # neonews' tests run against their OWN database, never the engine's — the flows
      # sweep whole tables, so sharing one is how a test reaches rows it doesn't own.
      NEONEWS_TEST_POSTGRES_URL: postgresql://ingestion:ingestion@localhost:5432/neonews_test
      NEONEWS_POSTGRES_URL: postgresql://ingestion:ingestion@localhost:5432/neonews_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Create the test database
        run: PGPASSWORD=ingestion createdb -U ingestion -h localhost neonews_test
      - name: Apply migrations (schema for DB-backed tests)
        run: uv run alembic upgrade head
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .
      # No engine or OpenRouter credentials are set: every such call is stubbed, and a
      # test that tried to reach either would fail here rather than spend money.
      - name: Pytest
        run: uv run pytest -q

  neonews-image:
    name: build check (Docker image)
    needs: neonews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validate the image builds; the real build+push happens on the node during
      # deploy.sh, before `pulumi up` in a `set -e` script — a build failure here
      # (e.g. lockfile drift) means neither the neonews nor the engine change
      # reaches the cluster, so catch it in CI first.
      - name: Build neonews image (no push)
        run: docker build -t anything-neonews:ci neonews

  test:
    name: test + lint + type (ingestion)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ingestion
          POSTGRES_PASSWORD: ingestion
          POSTGRES_DB: ingestion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ingestion -d ingestion"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ingestion
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ingestion 'RETURN 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 40s
    env:
      INGESTION_POSTGRES_URL: postgresql://ingestion:ingestion@localhost:5432/ingestion
      INGESTION_NEO4J_URI: bolt://localhost:7687
      INGESTION_NEO4J_USER: neo4j
      INGESTION_NEO4J_PASSWORD: ingestion
      INGESTION_OPENROUTER_API_KEY: test-key-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Apply migrations (schema for DB-backed tests)
        run: uv run alembic upgrade head
      - name: Bootstrap Neo4j schema (fulltext index)
        run: uv run python -c "from neo4j_client import bootstrap_schema; bootstrap_schema()"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .
      - name: Pytest
        run: uv run pytest -q

  image:
    name: build check (Docker image)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validate the image builds; the real build+push happens on the node during deploy.
      - name: Build ingestion image (no push)
        run: docker build -t anything-ingestion:ci ingestion

  deploy-syntax:
    name: syntax check (deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No cluster access, no secrets, no Pulumi CLI — just catch a typo in the
      # Pulumi program before it reaches a real deploy (nothing else in CI ever
      # evaluates deploy/__main__.py).
      - name: Parse deploy/__main__.py
        run: python3 -c "import ast; ast.parse(open('deploy/__main__.py').read())"

  web:
    name: typecheck + build (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Action inputs resolve from the repo root, which has no package.json —
          # `defaults.run.working-directory` only applies to `run:` steps. Without
          # this the action fails with "No pnpm version is specified".
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
