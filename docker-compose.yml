services:
  postgres:
    image: postgres:16
    container_name: ingestion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ingestion
      POSTGRES_DB: ingestion
    ports:
      - "5432:5432"
    volumes:
      - ingestion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  # On-demand DB schema docs. Generate with:
  #   docker compose --profile tools run --rm schemaspy
  # Then open ./schemaspy/output/index.html
  schemaspy:
    image: schemaspy/schemaspy:latest
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./schemaspy/output:/output
    command: >
      -t pgsql -host postgres -port 5432
      -db ingestion -u ingestion -p ingestion -s public

volumes:
  ingestion-pgdata:
